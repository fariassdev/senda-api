[project]
name = "senda"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai==1.28.0",
    "pyaudio==0.2.14",
    "python-dotenv==1.1.1",
    "requests==2.32.4",
    "pydub==0.25.1",
    "audioop-lts==0.2.2",

    # API dependencies
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.42",
    "psycopg[binary,pool]==3.2.9",
    "alembic==1.16.4",
    "boto3==1.40.7",
    
    # Authentication dependencies
    "PyJWT==2.10.1",
    "bcrypt==5.0.0",
    "python-multipart==0.0.20",
    "slowapi==0.1.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pre-commit==4.2.0",
    "ruff==0.12.7",
]
