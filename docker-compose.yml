  postgres:
    image: postgres:18
    container_name: senda-postgres
    restart: always
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/18/docker

  db_seed:
    image: postgres:18
    container_name: senda-db-seed
    env_file:
      - .env
    volumes:
      - ./docker/postgres_init:/docker-entrypoint-initdb.d:ro
    depends_on:
      - postgres
    entrypoint:
      - sh
      - -c
      - |
        # Wait for Postgres to be ready
        until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
          echo "Waiting for Postgres to be ready...";
          sleep 1;
        done;

        export PGPASSWORD="$POSTGRES_PASSWORD";

        # Wait for migrations to be applied by checking for either
        # the alembic_version table or the 'user' table.
        tries=0
        max_tries=60
        while true; do
          if psql -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1 FROM alembic_version LIMIT 1;" >/dev/null 2>&1; then
            echo "Detected alembic_version. Proceeding to seed...";
            break;
          fi
          if psql -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1 FROM \"user\" LIMIT 1;" >/dev/null 2>&1; then
            echo "Detected user table. Proceeding to seed...";
            break;
          fi
          if [ "$tries" -ge "$max_tries" ]; then
            echo "Timed out waiting for migrations (alembic_version or user table) to appear. Exiting with error.";
            exit 1;
          fi
          tries=$((tries+1));
          echo "Waiting for migrations to be applied (try ${tries}/${max_tries})...";
          sleep 1;
        done;

        # Run the seed SQL if the file is present
        if [ -f /docker-entrypoint-initdb.d/seed_db.sql ]; then
          psql -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /docker-entrypoint-initdb.d/seed_db.sql;
        else
          echo "Seed SQL file not found, skipping.";
        fi
    restart: "no"

  kokoro_tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    restart: always
    ports:
      - "8880:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pg_data:
