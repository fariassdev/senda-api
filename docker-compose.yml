  postgres:
    image: postgres:18
    container_name: senda-postgres
    restart: always
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
      interval: 10s
      timeout: 10s
      retries: 5
    volumes:
      - pg_data:/var/lib/postgresql/18/docker
      - ./docker/postgres_init:/docker-entrypoint-initdb.d:ro

  kokoro_tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    restart: always
    ports:
      - "8880:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pg_data:
