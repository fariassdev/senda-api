openapi: 3.0.3
info:
  title: Senda CMS API
  description: |-
    API for managing and generating guided meditation courses and lessons for the Senda CMS.
    
    Provides endpoints to:
    - Retrieve course and lesson data.
    - Trigger generation of lesson scripts and audio.
    - Check the status of generation tasks.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Local Development Server

paths:
  /courses/{courseId}:
    get:
      summary: Get Course by ID
      description: Retrieves the full details of a single course, including the status of all its lessons.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            example: "introductory_course"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          description: Course not found

  /courses/{courseId}/generate-all:
    post:
      summary: Generate All Ungenerated Lessons
      description: |-
        Triggers an asynchronous background task to generate the script and audio for all lessons in the course that have not yet been successfully generated.
        Skips lessons that are already in a 'COMPLETED' state.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            example: "introductory_course"
      responses:
        '202':
          description: Accepted. Generation process has been started for all eligible lessons.
        '404':
          description: Course not found
        '409':
          description: A generation task is already in progress for this course.

  /courses/{courseId}/lessons/{lessonId}/generate:
    post:
      summary: Generate a Single Lesson
      description: Triggers an asynchronous background task to generate the script and audio for a specific lesson. Can be used for initial generation or to regenerate a failed or existing lesson.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            example: "introductory_course"
        - name: lessonId
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '202':
          description: Accepted. Generation process has been started for the lesson.
        '404':
          description: Course or lesson not found
        '409':
          description: A generation task is already in progress for this lesson.

components:
  schemas:
    Course:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the course.
          example: "introductory_course"
        title:
          type: string
          example: "Introduction to Mindfulness"
        description:
          type: string
          example: "A 10-day course to begin your mindfulness journey."
        author:
          type: string
          example: "Senda AI"
        imagePlaceholderUrl:
          type: string
          format: uri
          example: "https://placehold.co/600x400"
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/Lesson'

    Lesson:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the lesson within the course.
          example: 1
        lessonNumber:
          type: integer
          example: 1
        title:
          type: string
          example: "The First Step"
        corePractice:
          type: string
          example: "Mindful Breathing"
        keyPoint:
          type: string
          example: "Focusing on the sensation of breath."
        tone:
          type: string
          example: "Calm and reassuring"
        durationMinutes:
          type: integer
          example: 10
        status:
          $ref: '#/components/schemas/LessonStatus'
        scriptUrl:
          type: string
          format: uri
          description: URL to the generated JSON script. Only present if the script has been generated.
          example: "/generated_courses/introductory_course/lesson_1_script.json"
        audioUrl:
          type: string
          format: uri
          description: URL to the generated MP3 audio file. Only present if the audio has been generated.
          example: "/generated_courses/introductory_course/lesson_1_audio.mp3"

    LessonStatus:
      type: string
      enum:
        - NOT_GENERATED
        - GENERATING
        - COMPLETED
        - FAILED
      description: The current generation status of the lesson.
      example: NOT_GENERATED
