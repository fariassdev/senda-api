[mypy]
python_version = 3.12
ignore_missing_imports = True
allow_redefinition = True
warn_no_return = False
check_untyped_defs = False
disallow_untyped_defs = True
warn_unused_ignores = True
follow_imports = skip
strict_optional = True
exclude = .ve|env|logs|senda/infrastructure/repositories/article\.py|senda/infrastructure/repositories/comment\.py|senda/infrastructure/repositories/article_tag\.py|senda/infrastructure/mappers/article\.py|senda/infrastructure/mappers/comment\.py|senda/api/schemas/requests/user\.py|senda/services/user\.py|senda/services/auth\.py|senda/infrastructure/mappers/user\.py

[mypy-dateutil.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[tool:pytest]
norecursedirs=.ve
addopts = -ra -q -s -v --disable-warnings

[coverage:run]
omit = ./senda/infrastructure/alembic/*
