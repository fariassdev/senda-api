name: Deploy to Cloud Run

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  APP_NAME: senda
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev

permissions:
  contents: read
  id-token: write

jobs:
  # ===========================================================================
  # Test Job - Run tests before building
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: senda
          POSTGRES_PASSWORD: 4Qgr7DpEf2wLur4eAwhuSiw7s
          POSTGRES_DB: senda_db_test
        ports:
          - 5439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        env:
          APP_ENV: test
          SECRET_KEY: test_secret_key_1bf3a1a7bdde15dc8804089e9611a87418ec03a2f428216d9ccc61a4dad809cc
          JWT_SECRET_KEY: test_jwt_secret_key_b04e55639788f0062089ce39893dd2ceeabcc2d228e1258479ad25b9b63b797c
          POSTGRES_USER: senda
          POSTGRES_PASSWORD: 4Qgr7DpEf2wLur4eAwhuSiw7s
          POSTGRES_DB: senda_db_test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5439
          AWS_ACCESS_KEY_ID: test_access_key
          AWS_SECRET_ACCESS_KEY: test_secret_key
          GEMINI_API_KEY: test_gemini_api_key
        run: uv run pytest -v ./tests --tb=short

      - name: Output test summary
        if: always()
        run: |
          echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed. Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # Build Job - Build and push Docker image to Artifact Registry
  # ===========================================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.primary_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "primary_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "primary_tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ steps.meta.outputs.primary_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Output image info
        run: |
          echo "### 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ github.sha }}\`, \`${{ steps.meta.outputs.primary_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Cache:** GitHub Actions cache enabled ✨" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Migrate Staging - Run database migrations before deployment
  # ===========================================================================
  migrate-staging:
    name: Run Staging Migrations
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run database migrations
        run: |
          echo "🔄 Running database migrations for staging..."

          SERVICE_NAME="${{ env.APP_NAME }}-staging"
          JOB_NAME="${{ env.APP_NAME }}-staging-migrations"

          # Get environment variables from the existing Cloud Run service as JSON
          echo "📋 Fetching environment variables from $SERVICE_NAME..."
          ENV_JSON=$(gcloud run services describe $SERVICE_NAME \
            --region ${{ env.REGION }} \
            --format='json(spec.template.spec.containers[0].env)')

          # Parse JSON to KEY=VALUE format
          ENV_VARS=$(echo "$ENV_JSON" | jq -r '
            .spec.template.spec.containers[0].env // [] |
            map(select(.value != null) | "\(.name)=\(.value)") |
            join(",")
          ')

          # Add APP_ENV if not present or empty
          if [[ -z "$ENV_VARS" ]]; then
            ENV_VARS="APP_ENV=staging"
          elif [[ ! "$ENV_VARS" =~ "APP_ENV=" ]]; then
            ENV_VARS="${ENV_VARS},APP_ENV=staging"
          fi

          echo "📋 Environment variables configured"

          # Create or update the Cloud Run Job for migrations
          echo "🔧 Deploying migration job..."
          gcloud run jobs deploy $JOB_NAME \
            --image "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:staging" \
            --region ${{ env.REGION }} \
            --command "/bin/bash" \
            --args "./scripts/run-migrations.sh" \
            --set-env-vars "$ENV_VARS" \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet

          # Execute the job and wait for completion
          echo "🚀 Executing migrations..."
          gcloud run jobs execute $JOB_NAME \
            --region ${{ env.REGION }} \
            --wait

      - name: Output migration summary
        run: |
          echo "### ✅ Staging Migrations Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Job:** \`${{ env.APP_NAME }}-staging-migrations\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Deploy Staging - Automatic deployment on develop branch
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, migrate-staging]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.APP_NAME }}-staging
          region: ${{ env.REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:staging

      - name: Output deployment summary
        run: |
          echo "### 🚀 Staging Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ env.APP_NAME }}-staging\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** \`${{ env.REGION }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Migrate Production - Run database migrations before deployment
  # ===========================================================================
  migrate-production:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run database migrations
        run: |
          echo "🔄 Running database migrations for production..."

          SERVICE_NAME="${{ env.APP_NAME }}-production"
          JOB_NAME="${{ env.APP_NAME }}-production-migrations"

          # Get environment variables from the existing Cloud Run service as JSON
          echo "📋 Fetching environment variables from $SERVICE_NAME..."
          ENV_JSON=$(gcloud run services describe $SERVICE_NAME \
            --region ${{ env.REGION }} \
            --format='json(spec.template.spec.containers[0].env)')

          # Parse JSON to KEY=VALUE format
          ENV_VARS=$(echo "$ENV_JSON" | jq -r '
            .spec.template.spec.containers[0].env // [] |
            map(select(.value != null) | "\(.name)=\(.value)") |
            join(",")
          ')

          # Add APP_ENV if not present or empty
          if [[ -z "$ENV_VARS" ]]; then
            ENV_VARS="APP_ENV=prod"
          elif [[ ! "$ENV_VARS" =~ "APP_ENV=" ]]; then
            ENV_VARS="${ENV_VARS},APP_ENV=prod"
          fi

          echo "📋 Environment variables configured"

          # Create or update the Cloud Run Job for migrations
          echo "🔧 Deploying migration job..."
          gcloud run jobs deploy $JOB_NAME \
            --image "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:latest" \
            --region ${{ env.REGION }} \
            --command "/bin/bash" \
            --args "./scripts/run-migrations.sh" \
            --set-env-vars "$ENV_VARS" \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet

          # Execute the job and wait for completion
          echo "🚀 Executing migrations..."
          gcloud run jobs execute $JOB_NAME \
            --region ${{ env.REGION }} \
            --wait

      - name: Output migration summary
        run: |
          echo "### ✅ Production Migrations Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Job:** \`${{ env.APP_NAME }}-production-migrations\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Deploy Production - Requires manual approval on master or main branch
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, migrate-production]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.APP_NAME }}-production
          region: ${{ env.REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:latest

      - name: Output deployment summary
        run: |
          echo "### 🎉 Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ env.APP_NAME }}-production\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** \`${{ env.REGION }}\`" >> $GITHUB_STEP_SUMMARY
