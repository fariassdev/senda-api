name: Deploy to Cloud Run

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  APP_NAME: senda
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev

permissions:
  contents: read
  id-token: write

jobs:
  # ===========================================================================
  # Build Job - Build and push Docker image to Artifact Registry
  # ===========================================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.primary_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Extract metadata for Docker
        id: meta
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "primary_tag=latest" >> $GITHUB_OUTPUT
          else
            echo "primary_tag=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ github.sha }}" \
            --tag "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ steps.meta.outputs.primary_tag }}" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .

      - name: Push Docker image
        run: |
          docker push "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ github.sha }}"
          docker push "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:${{ steps.meta.outputs.primary_tag }}"

      - name: Output image info
        run: |
          echo "### 🐳 Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:** \`${{ github.sha }}\`, \`${{ steps.meta.outputs.primary_tag }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Migrate Staging - Run database migrations before deployment
  # ===========================================================================
  migrate-staging:
    name: Run Staging Migrations
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run database migrations
        run: |
          echo "🔄 Running database migrations for staging..."

          SERVICE_NAME="${{ env.APP_NAME }}-staging"
          JOB_NAME="${{ env.APP_NAME }}-staging-migrations"

          # Get environment variables from the existing Cloud Run service
          echo "📋 Fetching environment variables from $SERVICE_NAME..."
          ENV_VARS=$(gcloud run services describe $SERVICE_NAME \
            --region ${{ env.REGION }} \
            --format='value(spec.template.spec.containers[0].env.name,spec.template.spec.containers[0].env.value)' \
            | awk '{printf "%s=%s,", $1, $2}' \
            | sed 's/,$//')

          # Add APP_ENV if not present
          if [[ ! "$ENV_VARS" =~ "APP_ENV=" ]]; then
            ENV_VARS="${ENV_VARS},APP_ENV=staging"
          fi

          # Create or update the Cloud Run Job for migrations
          echo "🔧 Deploying migration job..."
          gcloud run jobs deploy $JOB_NAME \
            --image "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:staging" \
            --region ${{ env.REGION }} \
            --command "/bin/bash" \
            --args "./scripts/run-migrations.sh" \
            --set-env-vars "$ENV_VARS" \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet

          # Execute the job and wait for completion
          echo "🚀 Executing migrations..."
          gcloud run jobs execute $JOB_NAME \
            --region ${{ env.REGION }} \
            --wait

      - name: Output migration summary
        run: |
          echo "### ✅ Staging Migrations Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Job:** \`${{ env.APP_NAME }}-staging-migrations\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Deploy Staging - Automatic deployment on develop branch
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, migrate-staging]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.APP_NAME }}-staging
          region: ${{ env.REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:staging

      - name: Output deployment summary
        run: |
          echo "### 🚀 Staging Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ env.APP_NAME }}-staging\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** \`${{ env.REGION }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Migrate Production - Run database migrations before deployment
  # ===========================================================================
  migrate-production:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run database migrations
        run: |
          echo "🔄 Running database migrations for production..."

          SERVICE_NAME="${{ env.APP_NAME }}-production"
          JOB_NAME="${{ env.APP_NAME }}-production-migrations"

          # Get environment variables from the existing Cloud Run service
          echo "📋 Fetching environment variables from $SERVICE_NAME..."
          ENV_VARS=$(gcloud run services describe $SERVICE_NAME \
            --region ${{ env.REGION }} \
            --format='value(spec.template.spec.containers[0].env.name,spec.template.spec.containers[0].env.value)' \
            | awk '{printf "%s=%s,", $1, $2}' \
            | sed 's/,$//')

          # Add APP_ENV if not present
          if [[ ! "$ENV_VARS" =~ "APP_ENV=" ]]; then
            ENV_VARS="${ENV_VARS},APP_ENV=prod"
          fi

          # Create or update the Cloud Run Job for migrations
          echo "🔧 Deploying migration job..."
          gcloud run jobs deploy $JOB_NAME \
            --image "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:latest" \
            --region ${{ env.REGION }} \
            --command "/bin/bash" \
            --args "./scripts/run-migrations.sh" \
            --set-env-vars "$ENV_VARS" \
            --max-retries 0 \
            --task-timeout 300s \
            --quiet

          # Execute the job and wait for completion
          echo "🚀 Executing migrations..."
          gcloud run jobs execute $JOB_NAME \
            --region ${{ env.REGION }} \
            --wait

      - name: Output migration summary
        run: |
          echo "### ✅ Production Migrations Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Job:** \`${{ env.APP_NAME }}-production-migrations\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Deploy Production - Requires manual approval on master or main branch
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, migrate-production]
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.APP_NAME }}-production
          region: ${{ env.REGION }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.APP_NAME }}/${{ env.APP_NAME }}:latest

      - name: Output deployment summary
        run: |
          echo "### 🎉 Production Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ env.APP_NAME }}-production\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** \`${{ env.REGION }}\`" >> $GITHUB_STEP_SUMMARY
